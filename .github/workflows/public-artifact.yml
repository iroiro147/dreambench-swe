name: Public artifact

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-artifact.txt
      - run: python scripts/audit_public_tree.py --root .
      - name: Rebuild public artifact
        run: |
          SOURCE_DATE_EPOCH=$(python -c 'import datetime,json; value=json.load(open("MANIFEST.json"))["generated_at_utc"]; print(int(datetime.datetime.fromisoformat(value.replace("Z", "+00:00")).timestamp()))')
          export SOURCE_DATE_EPOCH
          PYTHONPATH=src python scripts/package_artifact.py --dist-dir /tmp/dreambench-dist
      - run: PYTHONPATH=src python scripts/validate_submission_package.py --dist-dir /tmp/dreambench-dist --mode public
      - run: python scripts/audit_public_tree.py --archive /tmp/dreambench-dist/dreambench-swe-artifact.tar.gz
      - run: python scripts/run_smoke.py
      - run: python -m pytest -q $(tr '\n' ' ' < public-tests.txt)
